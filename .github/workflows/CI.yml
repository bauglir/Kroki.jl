---
name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - main

jobs:
  Test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        version:
          - '1.6'
          - '1.10'
          - '1.13'
        include:
          # Use the native architecture per operating system. These have to
          # come first due to how the matrix expands for specific overrides
          # defined later to take effect properly!
          - os: macos-latest
            arch: aarch64
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          # No aarch64 builds exist for Julia v1.6
          - os: macos-latest
            arch: x64
            version: '1.6'
    env:
      OS: ${{ matrix.os }}
      JULIA: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 #v3.0.3
        with:
          arch: ${{ matrix.arch }}
          # The Julia v1.6 x64 builds have to run under Rosetta on macOS on
          # aarch64 machines as no x64 machines are available
          force-arch: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.arch == 'x64' }}
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 #v3.5.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 #v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 #v1.12.0
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 #v1.2.2
      - name: Codecov
        uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e #v7.1.1
        with:
          env_vars: OS,JULIA
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Coveralls parallel
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 #v2.3.8
        with:
          # Temporarily disable this step from failing the job. Coveralls is
          # experiencing infrastrucure issues preventing the full CI suite from
          # running. See https://status.coveralls.io/
          fail-on-error: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel: true
          path-to-lcov: ./lcov.info
  coveralls:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate Coveralls Reports
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 #v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
