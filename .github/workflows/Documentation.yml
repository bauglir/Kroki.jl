---
name: Documentation

on:
  pull_request:
  push:
    branches:
      - development
      - main
    tags:
      - v*

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4.4.0
      - uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 #v2.7.0
        with:
          version: '1.12'
      - uses: julia-actions/cache@dc1a3cdeacb521b0ca93cfc66143fcadb15a5bd0 #v1.5.2
      - name: Install dependencies
        run: julia --project=docs --eval 'using Pkg' --eval 'Pkg.instantiate()'
      - name: Build & Deploy
        run: julia --project=docs docs/make.jl
        env:
          # For authentication with GitHub Actions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
